# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates#package-ecosystem
version: 2
updates:
  # Enable version updates for Python (uv also refreshes uv.lock, which pip did not)
  - package-ecosystem: "uv"
    target-branch: "develop"
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # Build backends share the build-system.requires line, so bump them together
      build:
        patterns:
          - "nanobind"
          - "scikit-build-core"
      dev:
        patterns:
          - "*"
        exclude-patterns:
          - "nanobind"
          - "scikit-build-core"
  # Enable updates for Github Actions
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      # Match on patterns, not update-types: actions are pinned by SHA, and digest-only
      # bumps have no semver update type, so an update-types filter lets them escape the group
      actions:
        patterns:
          - "*"
